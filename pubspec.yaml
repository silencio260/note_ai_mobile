name: note_ai
description: "AI-powered voice recorder with transcription and intelligent chat"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─── Starter Kit ───────────────────────────────────────────────────────────
  # Provides: firebase_core, firebase_auth, cloud_firestore, firebase_storage,
  # firebase_analytics, firebase_crashlytics, firebase_remote_config,
  # google_sign_in, sign_in_with_apple, flutter_bloc, equatable, get_it,
  # dartz, dio, onesignal_flutter, shared_preferences, uuid, lottie,
  # google_mobile_ads, purchases_flutter, in_app_review, url_launcher
  starter_kit:
    path: packages/genrevibes_starter_kit

  # ─── Local Database (Hive) ─────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Firebase (declared explicitly since we import them directly) ───────────
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # ─── Auth ──────────────────────────────────────────────────────────────────
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.4

  # ─── State Management / DI / FP ────────────────────────────────────────────
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^9.0.0
  dartz: ^0.10.1

  # ─── Network ───────────────────────────────────────────────────────────────
  dio: ^5.4.0

  # ─── Audio ─────────────────────────────────────────────────────────────────
  record: ^6.1.1
  audioplayers: ^6.1.0
  just_audio: ^0.10.5
  wakelock_plus: ^1.2.8
  permission_handler: ^11.0.0

  # ─── Network / Connectivity ────────────────────────────────────────────────
  connectivity_plus: ^6.1.5

  # ─── Navigation ────────────────────────────────────────────────────────────
  go_router: ^16.2.1

  # ─── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.5

  # ─── AI / Markdown UI ──────────────────────────────────────────────────────
  flutter_markdown: ^0.6.18+2
  flutter_math_fork: ^0.7.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  bloc_test: ^10.0.0
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/
